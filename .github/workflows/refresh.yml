name: Refresh 2026 pitch data

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pitchquality-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-model.txt
      - run: pip install -c requirements-model.txt -e .
      - name: Find the latest successful snapshot from this workflow and branch
        id: snapshot
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'refresh.yml', branch: context.ref.replace('refs/heads/', ''),
              status: 'success', per_page: 20
            });
            for (const run of data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id: run.id
              });
              if (artifacts.data.artifacts.some(a => a.name === 'pitchquality-live' && !a.expired)) {
                return String(run.id);
              }
            }
            return '';
      - name: Restore SQLite (otherwise use the committed full-season snapshot)
        if: steps.snapshot.outputs.result != ''
        uses: actions/download-artifact@v4
        with:
          name: pitchquality-live
          path: data
          github-token: ${{ github.token }}
          run-id: ${{ steps.snapshot.outputs.result }}
      - name: Refresh using frozen estimators (offseason is a successful no-op)
        run: python -m pitchquality.live
      - name: Keep the SQLite snapshot for the next run and API consumers
        uses: actions/upload-artifact@v4
        with:
          name: pitchquality-live
          path: data/pitchquality.db
          if-no-files-found: error
          retention-days: 90
