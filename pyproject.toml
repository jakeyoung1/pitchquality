[project]
name = "pitchquality"
version = "0.1.0"
description = "Expected-whiff modeling on Statcast pitch-level data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4",
  "matplotlib>=3.8", "pyarrow>=15", "pybaseball>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
