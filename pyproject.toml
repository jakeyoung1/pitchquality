[project]
name = "pitchquality"
version = "0.1.0"
description = "Expected-whiff modeling on Statcast pitch-level data"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4",
  "matplotlib>=3.8", "pyarrow>=15", "pybaseball>=2.2",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fastapi>=0.115", "jinja2>=3.1", "httpx>=0.27"]
# The live API and dashboard. Render installs requirements-web.txt instead,
# which pins these and skips the modeling stack.
web = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitchquality = ["schema.sql"]
"pitchquality.web" = ["templates/*.html", "static/*"]
